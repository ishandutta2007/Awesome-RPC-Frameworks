<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 960 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080c16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="streamGradient1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".2"/></linearGradient><linearGradient id="streamGradient2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".2"/><stop offset="50%" stop-color="#c084fc" stop-opacity=".8"/><stop offset="100%" stop-color="#f43f5e" stop-opacity=".2"/></linearGradient><linearGradient id="badgeGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#334155" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes flow1{0%{stroke-dashoffset:400}}@keyframes flow2{0%{stroke-dashoffset:0}}@keyframes pulseGlow{0%{transform:scale(1);opacity:.5}50%{transform:scale(1.15);opacity:.9}}@keyframes packetFloat{0%{transform:translateY(0) scale(.9);opacity:.3}50%{transform:translateY(-8px) scale(1.1);opacity:.8}}.flow-line-1{stroke-dasharray:20 30;animation:flow1 7s linear infinite}