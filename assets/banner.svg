<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="streamGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="streamGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes flow1 {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes packetFloat {
      0% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
      50% { transform: translateY(-8px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
    }
    .flow-line-1 {
      stroke-dasharray: 20 30;
      animation: flow1 7s linear infinite;
    }
    .flow-line-2 {
      stroke-dasharray: 15 25;
      animation: flow2 8s linear infinite;
    }
    .flow-line-3 {
      stroke-dasharray: 10 20;
      animation: flow1 6s linear infinite;
    }
    .pulse-orb {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .float-particle {
      animation: packetFloat 5s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Deep Background -->
  <rect width="960" height="320" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5"/>

  <!-- Geometric Grid Pattern (Subtle Background) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="280" x2="960" y2="280" />
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="880" y1="0" x2="880" y2="320" />
  </g>

  <!-- Ambient Glow Blobs in Background -->
  <circle cx="150" cy="160" r="120" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="810" cy="160" r="140" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>
  <circle cx="480" cy="80" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Animated RPC Flow Data Lines -->
  <!-- Left Side Data Streams -->
  <path d="M 60 70 Q 140 110 200 80 T 320 120" fill="none" stroke="url(#streamGradient1)" stroke-width="2.5" class="flow-line-1" opacity="0.8"/>
  <path d="M 40 180 Q 130 140 220 200 T 350 170" fill="none" stroke="url(#streamGradient2)" stroke-width="2.5" class="flow-line-2" opacity="0.7"/>
  <path d="M 70 250 Q 160 210 240 260 T 360 230" fill="none" stroke="url(#streamGradient1)" stroke-width="2" class="flow-line-3" opacity="0.6"/>

  <!-- Right Side Data Streams -->
  <path d="M 620 100 Q 740 60 810 120 T 910 80" fill="none" stroke="url(#streamGradient2)" stroke-width="2.5" class="flow-line-2" opacity="0.8"/>
  <path d="M 600 170 Q 710 220 800 160 T 920 200" fill="none" stroke="url(#streamGradient1)" stroke-width="2.5" class="flow-line-1" opacity="0.7"/>
  <path d="M 640 240 Q 730 200 820 250 T 900 230" fill="none" stroke="url(#streamGradient2)" stroke-width="2" class="flow-line-3" opacity="0.6"/>

  <!-- Animated RPC Microservice Nodes / Packets -->
  <g class="float-particle" style="animation-delay: -1s;">
    <circle cx="110" cy="95" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="110" cy="95" r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" class="pulse-orb"/>
  </g>
  <g class="float-particle" style="animation-delay: -2.5s;">
    <circle cx="250" cy="190" r="6" fill="#818cf8" filter="url(#subtleGlow)"/>
    <circle cx="250" cy="190" r="14" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" class="pulse-orb"/>
  </g>
  <g class="float-particle" style="animation-delay: -0.5s;">
    <circle cx="720" cy="90" r="5" fill="#c084fc" filter="url(#subtleGlow)"/>
    <circle cx="720" cy="90" r="12" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4" class="pulse-orb"/>
  </g>
  <g class="float-particle" style="animation-delay: -3s;">
    <circle cx="850" cy="180" r="6" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="850" cy="180" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" class="pulse-orb"/>
  </g>

  <!-- Central Foreground Content (Unobstructed & High Contrast) -->
  <g text-anchor="middle">
    <!-- Top Micro-Badge -->
    <rect x="365" y="44" width="230" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="380" cy="57" r="4" fill="#10b981" class="pulse-orb"/>
    <text x="485" y="61" class="pill-text" font-size="11" fill="#38bdf8" letter-spacing="1">ULTRA-FAST MICROSERVICES</text>

    <!-- Main Title -->
    <text x="480" y="125" class="title-text" fill="url(#titleGradient)">Awesome RPC Frameworks</text>

    <!-- Subtitle -->
    <text x="480" y="162" class="subtitle-text">Curated Ecosystem of High-Performance Remote Procedure Call Technologies &amp; Tooling</text>

    <!-- Interactive / Feature Pills Row -->
    <g transform="translate(140, 204)">
      <!-- Pill 1: gRPC -->
      <g transform="translate(0, 0)">
        <rect width="105" height="34" rx="8" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1"/>
        <text x="52" y="21" text-anchor="middle" class="pill-text">⚡ gRPC</text>
      </g>
      <!-- Pill 2: Protobuf -->
      <g transform="translate(115, 0)">
        <rect width="115" height="34" rx="8" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1"/>
        <text x="57" y="21" text-anchor="middle" class="pill-text">📦 Protobuf</text>
      </g>
      <!-- Pill 3: Connect-RPC -->
      <g transform="translate(240, 0)">
        <rect width="130" height="34" rx="8" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1"/>
        <text x="65" y="21" text-anchor="middle" class="pill-text">🌐 Connect-RPC</text>
      </g>
      <!-- Pill 4: tRPC -->
      <g transform="translate(380, 0)">
        <rect width="105" height="34" rx="8" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1"/>
        <text x="52" y="21" text-anchor="middle" class="pill-text">🔷 tRPC</text>
      </g>
      <!-- Pill 5: Apache Thrift -->
      <g transform="translate(495, 0)">
        <rect width="140" height="34" rx="8" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1"/>
        <text x="70" y="21" text-anchor="middle" class="pill-text">🐘 Apache Thrift</text>
      </g>
      <!-- Pill 6: Streaming -->
      <g transform="translate(645, 0)">
        <rect width="125" height="34" rx="8" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1"/>
        <text x="62" y="21" text-anchor="middle" class="pill-text">🔄 Streaming</text>
      </g>
    </g>

    <!-- Footer Stats / Tagline -->
    <text x="480" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" letter-spacing="0.5">
      BINARY ENCODING • CROSS-LANGUAGE CONTRACTS • LOW LATENCY • CODE GENERATION
    </text>
  </g>
</svg>
