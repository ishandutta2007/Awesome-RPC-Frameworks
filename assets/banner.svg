esome RPC Frameworks</text><text x="480" y="162" class="subtitle-text">Curated Ecosystem of High-Performance Remote Procedure Call Technologies &amp; Tooling</text><g><g transform="translate(140, 204) translate(0, 0)"><rect width="105" height="34" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1" rx="8"/><text x="52" y="21" class="pill-text" text-anchor="middle">⚡ gRPC</text></g><g transform="translate(140, 204) translate(115, 0)"><rect width="115" height="34" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1" rx="8"/><text x="57" y="21" class="pill-text" text-anchor="middle">📦 Protobuf</text></g><g transform="translate(140, 204) translate(240, 0)"><rect width="130" height="34" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1" rx="8"/><text x="65" y="21" class="pill-text" text-anchor="middle">🌐 Connect-RPC</text></g><g transform="translate(140, 204) translate(380, 0)"><rect width="105" height="34" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1" rx="8"/><text x="52" y="21" class="pill-text" text-anchor="middle">🔷 tRPC</text></g><g transform="translate(140, 204) translate(495, 0)"><rect width="140" height="34" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1" rx="8"/><text x="70" y="21" class="pill-text" text-anchor="middle">🐘 Apache Thrift</text></g><g transform="translate(140, 204) translate(645, 0)"><rect width="125" height="34" fill="url(#badgeGradient)" stroke="#475569" stroke-width="1" rx="8"/><text x="62" y="21" class="pill-text" text-anchor="middle">🔄 Streaming</text></g></g><text x="480" y="278" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" letter-spacing=".5">BINARY ENCODING • CROSS-LANGUAGE CONTRACTS • LOW LATENCY • CODE GENERATION</text></g></svg>